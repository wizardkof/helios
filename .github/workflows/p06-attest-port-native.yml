name: P06 ATTEST port native diagnostics
run-name: DIAGNOSTIC_ATTEST_PORT ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [p06/e1-resume-315-20261007]
permissions:
  contents: read
concurrency:
  group: attest-port-native-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHON_VERSION: '3.12.10'
  RUST_TOOLCHAIN: nightly-2026-07-14
  LLVM_VERSION: '22.1.8'
  HELIOS_MSVC_VERSION: '14.44.35207'
  MESA_DIAGNOSTIC_SHA: 0a607ff349d220473abed2cd906db81f9352dfc3
jobs:
  native:
    if: github.repository == 'wizardkof/helios'
    runs-on: windows-2022
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/checkout@v7
        with:
          repository: wizardkof/mesa-helios
          ref: ${{ env.MESA_DIAGNOSTIC_SHA }}
          path: mesa-diagnostic
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc
      - uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: ${{ env.LLVM_VERSION }}
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/LLVM-${{ env.LLVM_VERSION }}-win64.exe
      - name: Native CPU controls; no product or GPU
        shell: pwsh
        run: ./ci/windows/Test-AttestPortNative.ps1 -Architecture ${{ matrix.architecture }} -MesaRoot "$env:GITHUB_WORKSPACE/mesa-diagnostic" -Output "$env:RUNNER_TEMP/attest-port-native"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostic-attest-port-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/attest-port-native
          if-no-files-found: error
          retention-days: 30
