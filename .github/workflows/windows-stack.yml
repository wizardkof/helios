  package:
    if: ${{ always() && !inputs.infrastructure_only && needs.driver.result == 'success' && needs.mesa.result == 'success' && needs.mesa_x86.result == 'success' &&
      needs.opencl.result == 'success' && needs.loaders.result == 'success' && needs.compatibility.result == 'success' }}
    name: Sign and assemble installable bundle (${{ matrix.configuration }})
    env:
      HELIOS_CI_CONFIGURATION: ${{ matrix.configuration }}
    needs:
    - driver
    - mesa
    - mesa_x86
    - opencl
    - loaders
    - compatibility
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration:
        - Release
        - Debug
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false
        fetch-depth: 1
      id: s00
    - name: Observe frozen CI executor profile
      shell: powershell
      run: ./ci/windows/Measure-CIRunner.ps1 -ReceiptDir "$env:RUNNER_TEMP/runner-qualification"
      id: s01
    - name: Initialize pinned PowerShell independently
      shell: powershell
      run: ./ci/windows/Initialize-CIPowerShell.ps1
      id: s02
    - name: Initialize candidate source-lock submodules
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: git submodule update --init --recursive dxvk-helios vkd3d-proton-helios icd/mesa
      id: s03
    - if: ${{ !inputs.infrastructure_only }}
      uses: actions/download-artifact@v8
      with:
        name: helios-driver-${{ matrix.configuration }}
        path: ${{ runner.temp }}/artifacts/driver
      id: s04
    - if: ${{ !inputs.infrastructure_only }}
      uses: actions/download-artifact@v8
      with:
        name: helios-mesa
        path: ${{ runner.temp }}/artifacts/mesa
      id: s05
    - if: ${{ !inputs.infrastructure_only }}
      uses: actions/download-artifact@v8
      with:
        name: helios-mesa-x86
        path: ${{ runner.temp }}/artifacts/mesa-x86
      id: s06
    - if: ${{ !inputs.infrastructure_only }}
      uses: actions/download-artifact@v8
      with:
        name: helios-opencl
        path: ${{ runner.temp }}/artifacts/opencl
      id: s07
    - if: ${{ !inputs.infrastructure_only }}
      uses: actions/download-artifact@v8
      with:
        name: helios-loaders
        path: ${{ runner.temp }}/artifacts/loaders
      id: s08
    - if: ${{ !inputs.infrastructure_only }}
      uses: actions/download-artifact@v8
      with:
        name: helios-compatibility
        path: ${{ runner.temp }}/artifacts/compatibility
      id: s09
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
      id: s10
    - name: Ensure Windows Driver Kit is installed
      shell: pwsh
      run: ./ci/windows/Install-WindowsDriverKit.ps1
      id: s12
    - name: Pre-package source fingerprint
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: '. ./ci/windows/CI-Qualification.ps1

        Write-CIFingerprint $env:GITHUB_WORKSPACE "$env:RUNNER_TEMP/helios-package-qualification" pre

        '
      id: s11
    - name: Install official LLVM 22.1.8 release
      if: always()
      shell: pwsh
      run: ./ci/windows/Install-PinnedLLVM.ps1 -ReceiptDir "$env:RUNNER_TEMP/tool-selection"
      id: s13
    - name: Select pinned LLVM compiler
      if: always()
      shell: pwsh
      run: ./ci/windows/Select-CIPinnedLLVM.ps1 -ReceiptDir "$env:RUNNER_TEMP/tool-selection"
      id: llvm_select
    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
      id: s14
    - name: Enforce installer producer pins
      shell: pwsh
      run: ./ci/windows/Assert-ComponentToolchain.ps1 -Component package -ReceiptDir "$env:RUNNER_TEMP/helios-package-qualification"
      id: s15
    - name: Build the self-contained installer skeleton
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: "./ci/windows/Invoke-CIProducer.ps1 -ReceiptDir \"$env:RUNNER_TEMP/helios-package-qualification\" -Producer \"installer-${{ matrix.configuration }}\" -Operation\
        \ {\n  ./ci/windows/Build-Installer.ps1 -RepoRoot $env:GITHUB_WORKSPACE -OutputDir \"$env:RUNNER_TEMP/helios-installer\" -Configuration ${{ matrix.configuration\
        \ }}\n}\n"
      id: s16
    - name: Seal installer producer identity
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: 'python ./ci/windows/ci_artifact.py seal --directory "$env:RUNNER_TEMP/helios-installer" --source-root $env:GITHUB_WORKSPACE --component installer --configuration
        ''${{ matrix.configuration }}'' --architecture x64

        if($LASTEXITCODE -ne 0){throw ''Installer identity sealing failed''}

        '
      id: s17
    - name: Read package metadata
      if: ${{ !inputs.infrastructure_only }}
      id: metadata
      shell: pwsh
      run: '$version = (Get-Content kmd_render/driver-version.env | Where-Object { $_ -match ''^HELIOS_KMD_VERSION='' }) -replace ''^HELIOS_KMD_VERSION='', ''''

        "version=$version" >> $env:GITHUB_OUTPUT

        "mesa=$(git rev-parse HEAD:icd/mesa)" >> $env:GITHUB_OUTPUT

        "dxvk=$(git rev-parse HEAD:dxvk-helios)" >> $env:GITHUB_OUTPUT

        "vkd3d=$(git rev-parse HEAD:vkd3d-proton-helios)" >> $env:GITHUB_OUTPUT

        '
    - name: Assemble and test-sign bundle
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: "./ci/windows/Invoke-CIProducer.ps1 -ReceiptDir \"$env:RUNNER_TEMP/helios-package-qualification\" -Producer \"package-${{ matrix.configuration }}\" -Operation\
        \ {\n  ./ci/windows/Assemble-Package.ps1 -RepoRoot $env:GITHUB_WORKSPACE -DriverArtifact \"$env:RUNNER_TEMP/artifacts/driver\" -MesaArtifact \"$env:RUNNER_TEMP/artifacts/mesa\"\
        \ -MesaX86Artifact \"$env:RUNNER_TEMP/artifacts/mesa-x86\" -OpenClArtifact \"$env:RUNNER_TEMP/artifacts/opencl\" -LoadersArtifact \"$env:RUNNER_TEMP/artifacts/loaders\"\
        \ -CompatibilityArtifact \"$env:RUNNER_TEMP/artifacts/compatibility\" -InstallerArtifact \"$env:RUNNER_TEMP/helios-installer\" -OutputDir \"$env:RUNNER_TEMP/helios-package\"\
        \ -Configuration '${{ matrix.configuration }}' -Version '${{ steps.metadata.outputs.version }}' -RepositoryCommit $env:GITHUB_SHA -MesaCommit '${{ steps.metadata.outputs.mesa\
        \ }}' -DxvkCommit '${{ steps.metadata.outputs.dxvk }}' -Vkd3dCommit '${{ steps.metadata.outputs.vkd3d }}' -ClvkCommit $env:CLVK_COMMIT -VulkanLoaderCommit\
        \ $env:VULKAN_LOADER_COMMIT -VulkanHeadersCommit $env:VULKAN_HEADERS_COMMIT -OpenClLoaderCommit $env:OPENCL_LOADER_COMMIT -OpenClHeadersCommit $env:OPENCL_HEADERS_COMMIT\n\
        }\n"
      id: s19
    - name: Independent final package extraction and native audit
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: 'python ./ci/windows/Verify-CIPackage.py --root "$env:RUNNER_TEMP/helios-package"

        if ($LASTEXITCODE -ne 0) { throw ''Final extraction/ZIP qualification failed'' }

        $lock=Get-Content metadata/candidate-reservation.json -Raw|ConvertFrom-Json

        ./ci/windows/Audit-CIPackage.ps1 -OutputDir "$env:RUNNER_TEMP/helios-package" -Version $lock.version -Fingerprint $lock.sourceFingerprint

        . ./ci/windows/CI-Qualification.ps1

        ./ci/windows/Assert-ComponentToolchain.ps1 -Component package -Phase post -ReceiptDir "$env:RUNNER_TEMP/helios-package-qualification"

        Write-CIFingerprint $env:GITHUB_WORKSPACE "$env:RUNNER_TEMP/helios-package-qualification" post

        @("FINAL_PACKAGE=PASS", "PUBLICATION=NO", "RUNTIME=NOT_RUN", "CI_RUN_ID=$env:GITHUB_RUN_ID", "CI_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT") | Set-Content "$env:RUNNER_TEMP/helios-package/QUALIFICATION_REPORT.txt"

        Write-CIHashIndex "$env:RUNNER_TEMP/helios-package"

        '
      id: s20
    - name: Admit and seal s21 transport
      id: s21_seal
      shell: powershell
      run: 'python ./ci/windows/artifact_roundtrip.py seal --root "${{ runner.temp }}/helios-package" --receipt "${{ runner.temp }}/artifact-roundtrip/s21.json"

        if ($LASTEXITCODE -ne 0) { throw "Artifact admission/seal failed" }'
      if: ${{ !inputs.infrastructure_only }}
    - if: ${{ always() && steps.s21_seal.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        name: helios-windows-x64-${{ steps.metadata.outputs.version }}-${{ matrix.configuration }}
        path: ${{ runner.temp }}/helios-package
        if-no-files-found: error
        retention-days: 90
        include-hidden-files: true
      id: s21
    - name: Download real s21 artifact
      id: s21_download
      uses: actions/download-artifact@v8
      with:
        name: helios-windows-x64-${{ steps.metadata.outputs.version }}-${{ matrix.configuration }}
        path: ${{ runner.temp }}/artifact-roundtrip-download/s21
      if: ${{ always() && steps.s21.outcome == 'success' }}
    - name: Verify real s21 roundtrip set size hashes
      id: s21_verify
      shell: powershell
      run: 'python ./ci/windows/artifact_roundtrip.py verify --root "${{ runner.temp }}/artifact-roundtrip-download/s21" --receipt "${{ runner.temp }}/artifact-roundtrip/s21.json"

        if ($LASTEXITCODE -ne 0) { throw "EVIDENCE_ROUNDTRIP_COMPLETENESS=FAIL" }

        Write-Host "EVIDENCE_ROUNDTRIP_COMPLETENESS=PASS"'
      if: ${{ always() && steps.s21_download.outcome == 'success' }}
    - name: Collect explicit failure and qualification evidence
      id: collect_evidence
      if: always()
      shell: powershell
      env:
        HELIOS_STEPS_JSON: ${{ toJSON(steps) }}
        HELIOS_PRIMARY_RESULT: ${{ job.status }}
      run: ./ci/windows/Collect-CIEvidence.ps1 -Job package -Root C:/he
    - name: Admit and seal upload_evidence transport
      id: upload_evidence_seal
      shell: powershell
      run: 'python ./ci/windows/artifact_roundtrip.py seal --root "C:/he" --receipt "${{ runner.temp }}/artifact-roundtrip/upload_evidence.json"

        if ($LASTEXITCODE -ne 0) { throw "Artifact admission/seal failed" }'
      if: ${{ always() }}
    - name: Preserve package qualification and failure evidence
      if: ${{ always() && steps.upload_evidence_seal.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        name: helios-package-receipts-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: C:/he
        if-no-files-found: error
        retention-days: 90
        include-hidden-files: true
      id: upload_evidence
    - name: Download real upload_evidence artifact
      id: upload_evidence_download
      uses: actions/download-artifact@v8
      with:
        name: helios-package-receipts-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/artifact-roundtrip-download/upload_evidence
      if: ${{ always() && steps.upload_evidence.outcome == 'success' }}
    - name: Verify real upload_evidence roundtrip set size hashes
      id: upload_evidence_verify
      shell: powershell
      run: 'python ./ci/windows/artifact_roundtrip.py verify --root "${{ runner.temp }}/artifact-roundtrip-download/upload_evidence" --receipt "${{ runner.temp }}/artifact-roundtrip/upload_evidence.json"

        if ($LASTEXITCODE -ne 0) { throw "EVIDENCE_ROUNDTRIP_COMPLETENESS=FAIL" }

        Write-Host "EVIDENCE_ROUNDTRIP_COMPLETENESS=PASS"'
      if: ${{ always() && steps.upload_evidence_download.outcome == 'success' }}
    - name: Report separate evidence outcomes
      if: always()
      shell: powershell
      run: Write-Host "EVIDENCE_COLLECTION_RESULT=${{ steps.collect_evidence.outcome }} EVIDENCE_UPLOAD_RESULT=${{ steps.upload_evidence.outcome }}" EVIDENCE_ROUNDTRIP_COMPLETENESS=${{
        steps.upload_evidence_verify.outcome }}
  python_evidence_preflight:
    name: Native Python test dependency and evidence contracts
    runs-on: windows-2022
    if: ${{ inputs.infrastructure_only && inputs.python_evidence_only && !inputs.producer_audit_control_only }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      id: checkout
      with:
        submodules: false
        fetch-depth: 1
    - uses: actions/setup-python@v7
      id: python_setup
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Bootstrap exact native test interpreter and real consumer RED GREEN
      shell: powershell
      run: ./ci/windows/Initialize-TestPython.ps1 -Control -Tests
      id: python_dependencies
    - name: Synthetic admitted hidden and private exclusion control
      shell: powershell
      run: ./ci/windows/Test-CIEvidence.ps1 -Root C:/he-control
      id: transport_fixture
    - name: Admit and seal transport_upload transport
      id: transport_upload_seal
      shell: powershell
      run: 'python ./ci/windows/artifact_roundtrip.py seal --root "C:/he-control" --receipt "${{ runner.temp }}/artifact-roundtrip/transport_upload.json"

        if ($LASTEXITCODE -ne 0) { throw "Artifact admission/seal failed" }'
      if: ${{ success() }}
    - name: Upload focused evidence control
      uses: actions/upload-artifact@v7
      id: transport_upload
      with:
        name: helios-evidence-control-${{ github.run_id }}-${{ github.run_attempt }}
        path: C:/he-control
        if-no-files-found: error
        retention-days: 90
        include-hidden-files: true
      if: ${{ always() && steps.transport_upload_seal.outcome == 'success' }}
    - name: Download real transport_upload artifact
      id: transport_upload_download
      uses: actions/download-artifact@v8
      with:
        name: helios-evidence-control-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/artifact-roundtrip-download/transport_upload
      if: ${{ always() && steps.transport_upload.outcome == 'success' }}
    - name: Verify real transport_upload roundtrip set size hashes
      id: transport_upload_verify
      shell: powershell
      run: 'python ./ci/windows/artifact_roundtrip.py verify --root "${{ runner.temp }}/artifact-roundtrip-download/transport_upload" --receipt "${{ runner.temp }}/artifact-roundtrip/transport_upload.json"

        if ($LASTEXITCODE -ne 0) { throw "EVIDENCE_ROUNDTRIP_COMPLETENESS=FAIL" }

        Write-Host "EVIDENCE_ROUNDTRIP_COMPLETENESS=PASS"'
      if: ${{ always() && steps.transport_upload_download.outcome == 'success' }}
    - name: Collect focused dependency receipts
      id: collect_evidence
      shell: powershell
      env:
        HELIOS_STEPS_JSON: ${{ toJSON(steps) }}
        HELIOS_PRIMARY_RESULT: ${{ job.status }}
      run: ./ci/windows/Collect-CIEvidence.ps1 -Job python_evidence_preflight -Root C:/he
      if: always()
    - name: Admit and seal upload_evidence transport
      id: upload_evidence_seal
      shell: powershell
      run: 'python ./ci/windows/artifact_roundtrip.py seal --root "C:/he" --receipt "${{ runner.temp }}/artifact-roundtrip/upload_evidence.json"

        if ($LASTEXITCODE -ne 0) { throw "Artifact admission/seal failed" }'
      if: ${{ always() }}
    - name: Upload focused Python evidence
      id: upload_evidence
      uses: actions/upload-artifact@v7
      with:
        name: helios-python-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: C:/he
        if-no-files-found: error
        retention-days: 90
        include-hidden-files: true
      if: ${{ always() && steps.upload_evidence_seal.outcome == 'success' }}
    - name: Download real upload_evidence artifact
      id: upload_evidence_download
      uses: actions/download-artifact@v8
      with:
        name: helios-python-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/artifact-roundtrip-download/upload_evidence
      if: ${{ always() && steps.upload_evidence.outcome == 'success' }}
    - name: Verify real upload_evidence roundtrip set size hashes
      id: upload_evidence_verify
      shell: powershell
      run: 'python ./ci/windows/artifact_roundtrip.py verify --root "${{ runner.temp }}/artifact-roundtrip-download/upload_evidence" --receipt "${{ runner.temp }}/artifact-roundtrip/upload_evidence.json"

        if ($LASTEXITCODE -ne 0) { throw "EVIDENCE_ROUNDTRIP_COMPLETENESS=FAIL" }

        Write-Host "EVIDENCE_ROUNDTRIP_COMPLETENESS=PASS"'
      if: ${{ always() && steps.upload_evidence_download.outcome == 'success' }}
  producer_audit_control:
    name: Integrated host and private WDK producer audit control
    runs-on: windows-2022
    if: ${{ inputs.infrastructure_only && inputs.python_evidence_only && inputs.producer_audit_control_only }}
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false
        fetch-depth: 1
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install pinned Rust toolchain
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
    - name: Install pinned cargo-make and host helper
      shell: pwsh
      run: |
        cargo install cargo-make --locked --version $env:CARGO_MAKE_VERSION
        if ($LASTEXITCODE -ne 0) { throw 'cargo-make install failed' }
        cargo install rust-script --locked --version $env:RUST_SCRIPT_VERSION
        if ($LASTEXITCODE -ne 0) { throw 'host rust-script install failed' }
    - name: Ensure pinned Windows Driver Kit is installed
      shell: pwsh
      run: ./ci/windows/Install-WindowsDriverKit.ps1
    - name: Initialize isolated producer helpers
      shell: pwsh
      run: ./ci/windows/Initialize-CIIsolation.ps1
    - name: Run actual adapted WDK and host diagnostic tasks
      shell: pwsh
      run: |
        $auditRoot = Join-Path $env:RUNNER_TEMP 'producer-audit-control'
        New-Item -ItemType Directory -Path $auditRoot | Out-Null
        Push-Location (Join-Path $env:GITHUB_WORKSPACE 'kmd_render')
        try {
          $redAudit = Join-Path $auditRoot 'producer-audit-red.executions.jsonl'
          $redTranscript = Join-Path $auditRoot 'producer-audit-red.console.log'
          & (Join-Path $env:GITHUB_WORKSPACE 'ci/windows/Invoke-IsolatedCargoMake.ps1') -KmdRoot (Join-Path $env:GITHUB_WORKSPACE 'kmd_render') -Profile release -Task 'producer-audit-diagnostic' -AuditFile $redAudit -ControlOriginalRustRunner 2>&1 | Tee-Object -FilePath $redTranscript
          if ($LASTEXITCODE -ne 0) { throw 'Original CargoMake @rust RED control task failed' }
          $selectedLine = Select-String -Path $redTranscript -Pattern 'HOST_SELECTED_EXECUTABLE=(.+)' | Select-Object -Last 1
          $taskPathLine = Select-String -Path $redTranscript -Pattern 'HOST_TASK_PATH=(.+)' | Select-Object -Last 1
          if (!$selectedLine) { throw 'Could not observe actual CargoMake @rust executable path' }
          if (!$taskPathLine) { throw 'Could not observe CargoMake task PATH' }
          $selectedExecutable = $selectedLine.Matches[0].Groups[1].Value.Trim()
          $taskPath = $taskPathLine.Matches[0].Groups[1].Value.Trim()
          [ordered]@{selectedExecutable=$selectedExecutable;expectedHostExecutable=$env:HELIOS_HOST_RUST_SCRIPT;effectiveTaskPath=$taskPath;dispatcherDirectory=(Join-Path $env:HELIOS_ISOLATION_ROOT 'host-dispatch')}|ConvertTo-Json -Compress|Set-Content (Join-Path $auditRoot 'producer-audit-red-resolution.json') -Encoding UTF8
          if ($selectedExecutable -cne $env:HELIOS_HOST_RUST_SCRIPT) { throw "Observed unexpected CargoMake @rust executable: $selectedExecutable" }
          & (Join-Path $env:GITHUB_WORKSPACE 'ci/windows/Invoke-IsolatedCargoMake.ps1') -KmdRoot (Join-Path $env:GITHUB_WORKSPACE 'kmd_render') -Profile release -Task 'producer-audit-diagnostic' -AuditFile (Join-Path $auditRoot 'producer-audit-diagnostic.executions.jsonl')
          if ($LASTEXITCODE -ne 0) { throw 'Integrated producer diagnostic task failed' }
          & (Join-Path $env:GITHUB_WORKSPACE 'ci/windows/Test-ProducerAuditExit.ps1') -AuditDirectory $auditRoot -KmdRoot (Join-Path $env:GITHUB_WORKSPACE 'kmd_render') -RedAuditFile $redAudit -RedResolutionFile (Join-Path $auditRoot 'producer-audit-red-resolution.json')
        } finally { Pop-Location }
    - name: Admit and seal producer audit control evidence
      id: producer_audit_upload_seal
      if: always()
      shell: powershell
      run: |
        python ./ci/windows/artifact_roundtrip.py seal --root "${{ runner.temp }}/producer-audit-control" --receipt "${{ runner.temp }}/artifact-roundtrip/producer_audit_upload.json"
        if ($LASTEXITCODE -ne 0) { throw 'Producer audit artifact admission/seal failed' }
    - name: Upload producer audit control evidence
      id: producer_audit_upload
      uses: actions/upload-artifact@v7
      if: ${{ always() && steps.producer_audit_upload_seal.outcome == 'success' }}
      with:
        name: helios-producer-audit-control-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/producer-audit-control
        if-no-files-found: error
        retention-days: 90
        include-hidden-files: true
    - name: Download real producer audit control artifact
      id: producer_audit_upload_download
      if: ${{ always() && steps.producer_audit_upload.outcome == 'success' }}
      uses: actions/download-artifact@v8
      with:
        name: helios-producer-audit-control-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/artifact-roundtrip-download/producer_audit_upload
    - name: Verify real producer audit control roundtrip
      id: producer_audit_upload_verify
      if: ${{ always() && steps.producer_audit_upload_download.outcome == 'success' }}
      shell: powershell
      run: |
        python ./ci/windows/artifact_roundtrip.py verify --root "${{ runner.temp }}/artifact-roundtrip-download/producer_audit_upload" --receipt "${{ runner.temp }}/artifact-roundtrip/producer_audit_upload.json"
        if ($LASTEXITCODE -ne 0) { throw 'EVIDENCE_ROUNDTRIP_COMPLETENESS=FAIL' }
'on':
  workflow_dispatch:
    inputs:
      infrastructure_only:
        description: Provision and verify every CI toolchain job without product builds or candidate reservation
        type: boolean
        default: false
      python_evidence_only:
        description: Focused native Python dependencies and evidence transport controls only; requires infrastructure_only=true
        type: boolean
        default: false
      producer_audit_control_only:
        description: Run the isolated host and private WDK producer audit control; requires infrastructure_only=true and python_evidence_only=true
        type: boolean
        default: false
  push:
    branches:
    - master
    tags:
    - v*
  pull_request:
    branches:
    - master
