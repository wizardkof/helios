    - name: Install and validate Vulkan SDK
      shell: pwsh
      run: ./ci/windows/Install-VulkanSdk.ps1 -Version $env:VULKAN_SDK_VERSION
      id: s09
    - name: Install qualified CMake
      shell: pwsh
      run: python -m pip install "cmake==$env:CMAKE_VERSION"
      id: s10
    - name: Observe Ninja after OpenCL bootstrap
      shell: pwsh
      run: ./ci/windows/Observe-NinjaResolution.ps1 -Phase after-opencl-bootstrap-before-vs-import -ReceiptDir "$env:RUNNER_TEMP/ninja-resolution"
      id: ninja_after_bootstrap
    - name: Pre-build fingerprint (Verify-CandidateSource.ps1)
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: '. ./ci/windows/CI-Qualification.ps1

        Write-CIFingerprint $env:GITHUB_WORKSPACE "$env:RUNNER_TEMP/component-qualification" pre

        '
      id: s11
    - name: Enforce current producer pins
      shell: pwsh
      run: ./ci/windows/Assert-ComponentToolchain.ps1 -Component opencl -ReceiptDir "$env:RUNNER_TEMP/component-qualification"
      id: s12
    - name: Test child, Meson and CMake Ninja selection
      if: ${{ always() && inputs.infrastructure_only }}
      shell: pwsh
      run: ./ci/windows/Test-CINinjaConsumers.ps1 -RepoRoot $env:GITHUB_WORKSPACE -ReceiptDir "$env:RUNNER_TEMP/ninja-consumer-tests"
      id: ninja_consumer_tests
    - name: Build CLVK
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: "./ci/windows/Invoke-CIProducer.ps1 -ReceiptDir \"$env:RUNNER_TEMP/component-qualification\" -Producer \"component-build\" -Operation {\n  ./ci/windows/Build-OpenCL.ps1\
        \ -OutputDir \"$env:RUNNER_TEMP/helios-opencl\" -ClvkRepository $env:CLVK_REPOSITORY -ClvkCommit $env:CLVK_COMMIT\n}\n"
      id: s13
    - name: Post-build producer toolchain
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: ./ci/windows/Assert-ComponentToolchain.ps1 -Component opencl -Phase post -ReceiptDir "$env:RUNNER_TEMP/component-qualification"
      id: s14
    - name: Post-build fingerprint and hashes
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: '. ./ci/windows/CI-Qualification.ps1

        Write-CIFingerprint $env:GITHUB_WORKSPACE "$env:RUNNER_TEMP/component-qualification" post

        python ./ci/windows/ci_artifact.py seal --directory "$env:RUNNER_TEMP/helios-opencl" --source-root $env:GITHUB_WORKSPACE --component opencl --configuration
        Release --architecture x64

        if($LASTEXITCODE -ne 0){throw ''Component identity sealing failed''}

        Write-CIHashIndex "$env:RUNNER_TEMP/component-qualification"

        '
      id: s15
    - if: ${{ !inputs.infrastructure_only }}
      uses: actions/upload-artifact@v7
      with:
        name: helios-opencl
        path: ${{ runner.temp }}/helios-opencl
        if-no-files-found: error
        retention-days: 90
      id: s16
    - name: Collect explicit failure and qualification evidence
      id: collect_evidence
      if: always()
      shell: powershell
      env:
        HELIOS_STEPS_JSON: ${{ toJSON(steps) }}
        HELIOS_PRIMARY_RESULT: ${{ job.status }}
      run: ./ci/windows/Collect-CIEvidence.ps1 -Job opencl -Root C:/he
    - name: Preserve component qualification evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: helios-opencl-qualification-${{ github.run_id }}-${{ github.run_attempt }}
        path: C:/he
        if-no-files-found: error
        retention-days: 90
      id: upload_evidence
    - name: Report separate evidence outcomes
      if: always()
      shell: powershell
      run: Write-Host "EVIDENCE_COLLECTION_RESULT=${{ steps.collect_evidence.outcome }} EVIDENCE_UPLOAD_RESULT=${{ steps.upload_evidence.outcome }}"
  loaders:
