      id: s06
    - name: Install pinned sccache binary
      shell: pwsh
      run: '$root=Join-Path $env:RUNNER_TEMP ''sccache-0.18.0''

        $archive=Join-Path $env:RUNNER_TEMP ''sccache-0.18.0.zip''

        Invoke-WebRequest https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-pc-windows-msvc.zip -OutFile $archive

        Expand-Archive $archive $root

        $exe=@(Get-ChildItem $root -Recurse -Filter sccache.exe)

        if($exe.Count -ne 1){throw ''Pinned sccache executable missing''}

        $exe[0].DirectoryName >> $env:GITHUB_PATH

        '
      id: s07
    - name: Restore Vulkan SDK
      uses: actions/cache@v4
      with:
        path: C:/VulkanSDK/${{ env.VULKAN_SDK_VERSION }}
