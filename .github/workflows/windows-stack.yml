      if: always()
      shell: powershell
      env:
        HELIOS_STEPS_JSON: ${{ toJSON(steps) }}
        HELIOS_PRIMARY_RESULT: ${{ job.status }}
      run: ./ci/windows/Collect-CIEvidence.ps1 -Job compatibility -Root C:/he
    - name: Preserve component qualification evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: helios-compatibility-qualification-${{ github.run_id }}-${{ github.run_attempt }}
        path: C:/he
        if-no-files-found: error
        retention-days: 90
      id: upload_evidence
    - name: Report separate evidence outcomes
      if: always()
      shell: powershell
      run: Write-Host "EVIDENCE_COLLECTION_RESULT=${{ steps.collect_evidence.outcome }} EVIDENCE_UPLOAD_RESULT=${{ steps.upload_evidence.outcome }}"
  package:
    if: ${{ always() && !inputs.infrastructure_only && needs.driver.result == 'success' && needs.mesa.result == 'success' && needs.mesa_x86.result == 'success' && needs.opencl.result == 'success' && needs.loaders.result == 'success' && needs.compatibility.result == 'success' }}
    name: Sign and assemble installable bundle (${{ matrix.configuration }})
    env:
      HELIOS_CI_CONFIGURATION: ${{ matrix.configuration }}
    needs:
    - driver
    - mesa
    - mesa_x86
    - opencl
    - loaders
    - compatibility
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration:
        - Release
        - Debug
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false
        fetch-depth: 1
      id: s00
    - name: Observe frozen CI executor profile
      shell: powershell
      run: ./ci/windows/Measure-CIRunner.ps1 -ReceiptDir "$env:RUNNER_TEMP/runner-qualification"
      id: s01
    - name: Initialize pinned PowerShell independently
      shell: powershell
      run: ./ci/windows/Initialize-CIPowerShell.ps1
      id: s02
    - name: Initialize candidate source-lock submodules
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: git submodule update --init --recursive dxvk-helios vkd3d-proton-helios icd/mesa
      id: s03
    - if: ${{ !inputs.infrastructure_only }}
      uses: actions/download-artifact@v8
      with:
        name: helios-driver-${{ matrix.configuration }}
        path: ${{ runner.temp }}/artifacts/driver
      id: s04
    - if: ${{ !inputs.infrastructure_only }}
      uses: actions/download-artifact@v8
      with:
        name: helios-mesa
        path: ${{ runner.temp }}/artifacts/mesa
      id: s05
    - if: ${{ !inputs.infrastructure_only }}
      uses: actions/download-artifact@v8
      with:
        name: helios-mesa-x86
        path: ${{ runner.temp }}/artifacts/mesa-x86
      id: s06
    - if: ${{ !inputs.infrastructure_only }}
      uses: actions/download-artifact@v8
      with:
        name: helios-opencl
        path: ${{ runner.temp }}/artifacts/opencl
      id: s07
    - if: ${{ !inputs.infrastructure_only }}
      uses: actions/download-artifact@v8
      with:
        name: helios-loaders
        path: ${{ runner.temp }}/artifacts/loaders
      id: s08
    - if: ${{ !inputs.infrastructure_only }}
      uses: actions/download-artifact@v8
      with:
        name: helios-compatibility
        path: ${{ runner.temp }}/artifacts/compatibility
      id: s09
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
      id: s10
    - name: Ensure Windows Driver Kit is installed
      shell: pwsh
      run: ./ci/windows/Install-WindowsDriverKit.ps1
      id: s12
    - name: Pre-package source fingerprint
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: '. ./ci/windows/CI-Qualification.ps1

        Write-CIFingerprint $env:GITHUB_WORKSPACE "$env:RUNNER_TEMP/helios-package-qualification" pre

        '
      id: s11
    - name: Install official LLVM 22.1.8 release
      shell: pwsh
      run: ./ci/windows/Install-PinnedLLVM.ps1 -ReceiptDir "$env:RUNNER_TEMP/tool-selection"
      id: s13
    - name: Select pinned LLVM compiler
      if: always()
      shell: pwsh
      run: ./ci/windows/Select-CIPinnedLLVM.ps1 -ReceiptDir "$env:RUNNER_TEMP/tool-selection"
      id: llvm_select
    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
      id: s14
    - name: Enforce installer producer pins
      shell: pwsh
      run: ./ci/windows/Assert-ComponentToolchain.ps1 -Component package -ReceiptDir "$env:RUNNER_TEMP/helios-package-qualification"
      id: s15
    - name: Build the self-contained installer skeleton
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: "./ci/windows/Invoke-CIProducer.ps1 -ReceiptDir \"$env:RUNNER_TEMP/helios-package-qualification\" -Producer \"installer-${{ matrix.configuration\
        \ }}\" -Operation {\n  ./ci/windows/Build-Installer.ps1 -RepoRoot $env:GITHUB_WORKSPACE -OutputDir \"$env:RUNNER_TEMP/helios-installer\" -Configuration\
        \ ${{ matrix.configuration }}\n}\n"
      id: s16
    - name: Seal installer producer identity
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: 'python ./ci/windows/ci_artifact.py seal --directory "$env:RUNNER_TEMP/helios-installer" --source-root $env:GITHUB_WORKSPACE --component installer
        --configuration ''${{ matrix.configuration }}'' --architecture x64

        if($LASTEXITCODE -ne 0){throw ''Installer identity sealing failed''}

        '
      id: s17
    - name: Read package metadata
      if: ${{ !inputs.infrastructure_only }}
      id: metadata
      shell: pwsh
      run: '$version = (Get-Content kmd_render/driver-version.env | Where-Object { $_ -match ''^HELIOS_KMD_VERSION='' }) -replace ''^HELIOS_KMD_VERSION='',
        ''''

        "version=$version" >> $env:GITHUB_OUTPUT

        "mesa=$(git rev-parse HEAD:icd/mesa)" >> $env:GITHUB_OUTPUT

        "dxvk=$(git rev-parse HEAD:dxvk-helios)" >> $env:GITHUB_OUTPUT

        "vkd3d=$(git rev-parse HEAD:vkd3d-proton-helios)" >> $env:GITHUB_OUTPUT

        '
    - name: Assemble and test-sign bundle
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: "./ci/windows/Invoke-CIProducer.ps1 -ReceiptDir \"$env:RUNNER_TEMP/helios-package-qualification\" -Producer \"package-${{ matrix.configuration\
        \ }}\" -Operation {\n  ./ci/windows/Assemble-Package.ps1 -RepoRoot $env:GITHUB_WORKSPACE -DriverArtifact \"$env:RUNNER_TEMP/artifacts/driver\" -MesaArtifact\
        \ \"$env:RUNNER_TEMP/artifacts/mesa\" -MesaX86Artifact \"$env:RUNNER_TEMP/artifacts/mesa-x86\" -OpenClArtifact \"$env:RUNNER_TEMP/artifacts/opencl\"\
        \ -LoadersArtifact \"$env:RUNNER_TEMP/artifacts/loaders\" -CompatibilityArtifact \"$env:RUNNER_TEMP/artifacts/compatibility\" -InstallerArtifact\
        \ \"$env:RUNNER_TEMP/helios-installer\" -OutputDir \"$env:RUNNER_TEMP/helios-package\" -Configuration '${{ matrix.configuration }}' -Version '${{\
        \ steps.metadata.outputs.version }}' -RepositoryCommit $env:GITHUB_SHA -MesaCommit '${{ steps.metadata.outputs.mesa }}' -DxvkCommit '${{ steps.metadata.outputs.dxvk\
        \ }}' -Vkd3dCommit '${{ steps.metadata.outputs.vkd3d }}' -ClvkCommit $env:CLVK_COMMIT -VulkanLoaderCommit $env:VULKAN_LOADER_COMMIT -VulkanHeadersCommit\
        \ $env:VULKAN_HEADERS_COMMIT -OpenClLoaderCommit $env:OPENCL_LOADER_COMMIT -OpenClHeadersCommit $env:OPENCL_HEADERS_COMMIT\n}\n"
      id: s19
    - name: Independent final package extraction and native audit
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: 'python ./ci/windows/Verify-CIPackage.py --root "$env:RUNNER_TEMP/helios-package"

        if ($LASTEXITCODE -ne 0) { throw ''Final extraction/ZIP qualification failed'' }

        $lock=Get-Content metadata/candidate-reservation.json -Raw|ConvertFrom-Json

        ./ci/windows/Audit-CIPackage.ps1 -OutputDir "$env:RUNNER_TEMP/helios-package" -Version $lock.version -Fingerprint $lock.sourceFingerprint

        . ./ci/windows/CI-Qualification.ps1

        ./ci/windows/Assert-ComponentToolchain.ps1 -Component package -Phase post -ReceiptDir "$env:RUNNER_TEMP/helios-package-qualification"

        Write-CIFingerprint $env:GITHUB_WORKSPACE "$env:RUNNER_TEMP/helios-package-qualification" post

        @("FINAL_PACKAGE=PASS", "PUBLICATION=NO", "RUNTIME=NOT_RUN", "CI_RUN_ID=$env:GITHUB_RUN_ID", "CI_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT") | Set-Content
        "$env:RUNNER_TEMP/helios-package/QUALIFICATION_REPORT.txt"

        Write-CIHashIndex "$env:RUNNER_TEMP/helios-package"

        '
      id: s20
    - if: ${{ !inputs.infrastructure_only }}
      uses: actions/upload-artifact@v7
      with:
        name: helios-windows-x64-${{ steps.metadata.outputs.version }}-${{ matrix.configuration }}
        path: ${{ runner.temp }}/helios-package
        if-no-files-found: error
        retention-days: 90
      id: s21
    - name: Collect explicit failure and qualification evidence
      id: collect_evidence
      if: always()
      shell: powershell
      env:
        HELIOS_STEPS_JSON: ${{ toJSON(steps) }}
        HELIOS_PRIMARY_RESULT: ${{ job.status }}
      run: ./ci/windows/Collect-CIEvidence.ps1 -Job package -Root C:/he
    - name: Preserve package qualification and failure evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: helios-package-receipts-${{ matrix.configuration }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: C:/he
        if-no-files-found: error
        retention-days: 90
      id: upload_evidence
    - name: Report separate evidence outcomes
      if: always()
      shell: powershell
      run: Write-Host "EVIDENCE_COLLECTION_RESULT=${{ steps.collect_evidence.outcome }} EVIDENCE_UPLOAD_RESULT=${{ steps.upload_evidence.outcome }}"
'on':
  workflow_dispatch:
    inputs:
      infrastructure_only:
        description: Provision and verify every CI toolchain job without product builds or candidate reservation
        type: boolean
        default: false
  push:
    branches:
    - master
    tags:
    - v*
  pull_request:
    branches:
    - master
