        \ -RepoRoot $env:GITHUB_WORKSPACE -OutputDir \"$env:RUNNER_TEMP/helios-loaders\" -VulkanLoaderCommit $env:VULKAN_LOADER_COMMIT -VulkanHeadersCommit\
        \ $env:VULKAN_HEADERS_COMMIT -OpenClLoaderCommit $env:OPENCL_LOADER_COMMIT -OpenClHeadersCommit $env:OPENCL_HEADERS_COMMIT\n}\n"
      id: s08
    - name: Post-build producer toolchain
      if: ${{ !inputs.infrastructure_only }}
