  compatibility:
    if: ${{ always() && !inputs.infrastructure_only && needs.driver.result == 'success' }}
    needs:
    - driver
    name: Application compatibility shims
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: false
        fetch-depth: 1
      id: s00
    - name: Observe frozen CI executor profile
      shell: powershell
      run: ./ci/windows/Measure-CIRunner.ps1 -ReceiptDir "$env:RUNNER_TEMP/runner-qualification"
      id: s01
    - name: Initialize pinned PowerShell independently
      shell: powershell
      run: ./ci/windows/Initialize-CIPowerShell.ps1
      id: s02
    - name: Initialize source lock
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: git submodule update --init --recursive dxvk-helios vkd3d-proton-helios icd/mesa
      id: s03
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
      id: s04
    - name: Ensure Windows Driver Kit is installed
      id: kit_bootstrap
      shell: pwsh
      run: ./ci/windows/Install-WindowsDriverKit.ps1
    - name: Pre-build fingerprint (Verify-CandidateSource.ps1)
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: '. ./ci/windows/CI-Qualification.ps1

        Write-CIFingerprint $env:GITHUB_WORKSPACE "$env:RUNNER_TEMP/component-qualification" pre

        '
      id: s05
    - name: Enforce current producer pins
      shell: pwsh
      run: ./ci/windows/Assert-ComponentToolchain.ps1 -Component compatibility -ReceiptDir "$env:RUNNER_TEMP/component-qualification"
      id: s06
    - name: Build and validate compatibility shims
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: "./ci/windows/Invoke-CIProducer.ps1 -ReceiptDir \"$env:RUNNER_TEMP/component-qualification\" -Producer \"component-build\" -Operation {\n  ./ci/windows/Build-CompatibilityShims.ps1\
        \ -RepoRoot $env:GITHUB_WORKSPACE -OutputDir \"$env:RUNNER_TEMP/helios-compatibility\"\n}\n"
      id: s07
    - name: Post-build producer toolchain
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: ./ci/windows/Assert-ComponentToolchain.ps1 -Component compatibility -Phase post -ReceiptDir "$env:RUNNER_TEMP/component-qualification"
      id: s08
    - name: Post-build fingerprint and hashes
      if: ${{ !inputs.infrastructure_only }}
      shell: pwsh
      run: '. ./ci/windows/CI-Qualification.ps1

        Write-CIFingerprint $env:GITHUB_WORKSPACE "$env:RUNNER_TEMP/component-qualification" post

        python ./ci/windows/ci_artifact.py seal --directory "$env:RUNNER_TEMP/helios-compatibility" --source-root $env:GITHUB_WORKSPACE --component compatibility
        --configuration Release --architecture x64

        if($LASTEXITCODE -ne 0){throw ''Component identity sealing failed''}

        Write-CIHashIndex "$env:RUNNER_TEMP/component-qualification"

        '
      id: s09
    - if: ${{ !inputs.infrastructure_only }}
      uses: actions/upload-artifact@v7
      with:
        name: helios-compatibility
        path: ${{ runner.temp }}/helios-compatibility
