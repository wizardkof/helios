        HELIOS_PRIMARY_RESULT: ${{ job.status }}
      run: ./ci/windows/Collect-CIEvidence.ps1 -Job loaders -Root C:/he
    - name: Preserve component qualification evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: helios-loaders-qualification-${{ github.run_id }}-${{ github.run_attempt }}
        path: C:/he
        if-no-files-found: error
